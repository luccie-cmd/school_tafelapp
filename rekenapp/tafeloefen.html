<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafel app</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <main class="container">
        <div class="row justify-content-center mt-4 g-3">
            <div class="col-lg-8">
                <div class="card text-center">
                    <div class="card-header">
                        Tafel trainer
                    </div>
                    <div class="card-body">
                        <div class="row g-2">
                            <h5>Welke tafel wil je oefenen?</h5>
                        </div>
                        <form id="oefenForm">
                            <div class="row g-2">
                                <div class="col">
                                    <input type="text" class="form-control" id="tafelInput"
                                        placeholder="Welke tafel wil je oefenen?">
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary">
                                        Submit
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div class="row">
                            <div class="col">
                                <div id="tafelResultaat" class="mt-3"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-muted">
                        <span class="datum"></span>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card" style="height: auto;">
                    <div class="card-header">
                        Goede antwoorden
                    </div>
                    <div class="card-body p-0">
                        <ul id="goedeAntwoordenLijst" class="list-group list-group-flush">
                            <li class="list-group-item text-muted">Nog geen juiste antwoorden.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="/shared.js"></script>
    <script src="tafeloefen.js"></script>
</body>

</html>
