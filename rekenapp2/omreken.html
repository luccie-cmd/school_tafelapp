<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omrekenen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <main class="container">
        <div class="row justify-content-center mt-4">
            <div class="col-6">
                <div class="card text-center">
                    <div class="card-header">
                        Omrekenen
                    </div>
                    <div class="card-body">
                        <div class="row g-2">
                            <h5>Wat wil je omrekenen?</h5>
                        </div>
                        <form id="omrekenForm">
                            <div class="row g-2 mb-2 justify-content-center">
                                <div class="col-auto">
                                    <select class="form-select" id="dimensieSelect" aria-label="Kies een dimensie">
                                        <option value="1D" selected>1D - lengte</option>
                                        <option value="2D">2D - oppervlakte</option>
                                        <option value="3D">3D - inhoud</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="vanInput" placeholder="Van" disabled>
                                        <span class="input-group-text" id="vanEenheid">m<sup>2</sup></span>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="naarInput" placeholder="Naar">
                                        <span class="input-group-text" id="naarEenheid">m<sup>2</sup></span>
                                    </div>
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary">
                                        Submit
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div class="row">
                            <div class="col">
                                <div id="omrekenResultaat" class="mt-3"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-muted">
                        <span class="datum"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="/shared.js"></script>
</body>

</html>
